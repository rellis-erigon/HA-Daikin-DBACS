release_control:
  name: Release control
  description: >-
    Let go of every BACnet priority Home Assistant is holding on this
    gateway, so each point falls back to whatever holds a lower priority —
    or to its own default if nothing does. A BACnet write holds its priority
    until this is done, so without it Home Assistant keeps hold of every
    unit it has ever commanded.
  fields:
    device_id:
      name: Device
      description: >-
        One indoor-unit group. Leave empty to release everything on every
        gateway.
      required: false
      selector:
        device:
          integration: daikin_dbacs

apply_mapping:
  name: Apply site mapping
  description: >-
    Name and place the discovered indoor units from a mapping file. The
    gateway knows a unit only by its DIII-NET address, so room names, areas
    and equipment tags come from a file you maintain — a commissioning
    report or a schedule — and never from this integration. Each gateway
    reads its own file, named after its BACnet device instance. Reports
    what it would do by default.
  fields:
    dry_run:
      name: Dry run
      description: >-
        Report the changes without making them. On by default, because this
        renames and moves every device it matches.
      required: false
      default: true
      selector:
        boolean:
    host:
      name: Gateway
      description: >-
        Act on one gateway only, by its address. Leave empty to do every
        configured gateway, each from its own mapping file.
      required: false
      example: 192.0.2.10
      selector:
        text:
    path:
      name: Mapping file
      description: >-
        Override which file to read. Leave empty and each gateway uses
        /share/HA-Daikin-DBACS-site/gateway-<device instance>-units.json,
        which is what keeps two gateways apart — a DIII address is only
        unique within one gateway. If you set this while more than one
        gateway is configured, name the gateway with Host as well.
      required: false
      example: /share/HA-Daikin-DBACS-site/gateway-12-units.json
      selector:
        text:
    set_names:
      name: Set names
      required: false
      default: true
      selector:
        boolean:
    set_areas:
      name: Set areas
      description: Areas named in the file are created if they do not exist.
      required: false
      default: true
      selector:
        boolean:
    overwrite:
      name: Overwrite choices made by hand
      description: >-
        Off by default. A device somebody has renamed or placed themselves
        is left alone, because they knew something the file does not.
      required: false
      default: false
      selector:
        boolean:

generate_cards:
  name: Generate device cards
  description: >-
    Build a Lovelace card for every live indoor unit, in the shape the
    HA-Cards `custom:bridge-devices` dashboard strategy consumes. Each card
    binds from the device, so no entity ids are written out and a point
    enabled later is picked up without editing a dashboard.
  fields:
    area:
      name: Area
      description: Only units in this area. Leave empty for all of them.
      required: false
      selector:
        area:
    faceplate:
      name: Faceplate
      description: >-
        Override the card face for every unit. Left empty, each unit uses
        whatever its mapping file says, or the full status face.
      required: false
      example: fcu-unit
      selector:
        text:

purge_orphans:
  name: Remove orphaned entities
  description: >-
    Remove entities for points the gateway does not publish. These collect
    when a gateway is first set up before its Object_List can be read:
    discovery falls back to probing, which finds the units but not which
    members each one publishes, so an entity is made for every member this
    integration models. On a gateway whose firmware predates the
    ventilation members that is two entities per group which can never
    read. Reports what it would remove by default.
  fields:
    dry_run:
      name: Dry run
      description: >-
        List the orphans without removing them. On by default.
      required: false
      default: true
      selector:
        boolean:
    host:
      name: Gateway
      description: >-
        Act on one gateway only, by its address. Leave empty for all of
        them.
      required: false
      example: 192.0.2.10
      selector:
        text:
