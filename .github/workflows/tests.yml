name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # This repository is public, and the system it was developed against
      # is a working hotel. A real room number reached a test here within a
      # day of the mapping work starting, which is why this is a build
      # check rather than care.
      - name: No site-specific detail
        run: python3 scripts/check-no-site-detail.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest voluptuous bacpypes3
      - name: Test
        # The suite stubs Home Assistant when it is absent, so this runs
        # without a 400 MB dependency tree. See tests/_ha_stub.py.
        run: pytest tests -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
